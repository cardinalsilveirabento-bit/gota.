<style>
:root{--bg:#e9f8fb;--sf:#ffffff;--tx:#06303b;--mu:#4f7480;--ln:#c4e3ea;--ac:#0ea5e9;--co:#ff6b5b;--glass:#ffffff99;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04161c;--sf:#0a2832;--tx:#e6fbff;--mu:#8fb8c4;--ln:#15414f;--glass:#0a283299}}
:root[data-theme="dark"]{--bg:#04161c;--sf:#0a2832;--tx:#e6fbff;--mu:#8fb8c4;--ln:#15414f;--glass:#0a283299}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:14px 16px 40px;max-width:480px;margin:auto}
h1,h2,.big{font-family:"Bricolage Grotesque",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{font-size:26px;font-weight:800}
.streak{background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:4px 12px;font-size:14px}
.hero{position:relative;display:flex;align-items:center;gap:8px;justify-content:center}
.bottle{width:200px;height:280px;flex:none;filter:drop-shadow(0 12px 24px #0ea5e944)}
.wave{animation:w 3.2s linear infinite}.wave2{animation:w 5s linear infinite reverse;opacity:.5}
@keyframes w{to{transform:translateX(100px)}}
#lvl{transition:transform 1.2s cubic-bezier(.3,1.4,.5,1)}
.bub{animation:up 4s ease-in infinite;opacity:0}
@keyframes up{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-120px);opacity:0}}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.big{font-size:40px;font-weight:800;line-height:1}
.big small{font-size:16px;font-weight:500;color:var(--mu)}
.mu{color:var(--mu);font-size:14px}
.mascot{font-size:40px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}
.say{background:var(--sf);border:1px solid var(--ln);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:14px}
.next{margin:10px 0;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.drinks{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.drinks::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{border-color:var(--c,var(--ac));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--ac)) 25%,transparent)}
.sizes{display:flex;gap:6px;margin:4px 0 12px}
.sizes button{flex:1;border:1px solid var(--ln);background:transparent;color:var(--mu);border-radius:10px;padding:8px 0;font:inherit;font-size:14px;cursor:pointer}
.sizes button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.drink{width:100%;border:0;border-radius:20px;padding:16px;font:800 20px "Bricolage Grotesque",system-ui,sans-serif;color:#04161c;background:var(--c,var(--ac));cursor:pointer;box-shadow:0 8px 0 color-mix(in srgb,var(--c,var(--ac)) 55%,#000);transition:transform .1s,box-shadow .1s}
.drink:active{transform:translateY(6px);box-shadow:0 2px 0 color-mix(in srgb,var(--c,var(--ac)) 55%,#000)}
.drink{margin-bottom:12px}
.quote{font-size:13px;color:var(--mu);margin:0 0 8px;font-style:italic}
.rt{display:grid;gap:8px}
.it{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px 12px}
.it.done{opacity:.6}
.it.late{border-color:var(--co)}
.ck{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--c,var(--ac));background:transparent;color:#04161c;font-size:20px;cursor:pointer;padding:0}
.it.done .ck{background:var(--c,var(--ac))}
.it b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:17px}
.it.done b{text-decoration:line-through}
.it .inf{flex:1;min-width:0}
.it .ed{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer}
.add{width:100%;margin-top:8px;border:2px dashed var(--ln);background:transparent;color:var(--mu);border-radius:14px;padding:12px;font:inherit;cursor:pointer}
h2{font-size:18px;margin:22px 0 8px}
.week{display:flex;gap:6px;align-items:flex-end;height:90px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mu)}
.bar{width:100%;border-radius:6px 6px 2px 2px;background:var(--ac);min-height:3px;opacity:.85}
.bar.ok{background:#22c55e}
ul{list-style:none;padding:0;display:grid;gap:6px}
li{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;font-size:15px}
li span:nth-child(3){margin-left:auto;font-weight:600}
li button{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer}
.empty{color:var(--mu);font-size:14px;padding:6px 2px}
.set{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:6px 14px;display:grid}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:15px}
.row:last-child{border:0}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;width:92px}
input[type=color]{padding:0;width:44px;height:36px}
.sw{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--ln);position:relative;cursor:pointer;border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ac)}.sw.on::after{left:23px}
.btn{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#04161c;font-weight:600}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:456px;margin:auto;background:var(--co);color:#2a0600;border-radius:16px;padding:14px 16px;font-weight:600;transform:translateY(-160%);transition:transform .4s cubic-bezier(.3,1.5,.5,1);z-index:9;display:flex;gap:10px;align-items:center;cursor:pointer}
#toast.show{transform:none}
dialog{border:1px solid var(--ln);border-radius:18px;background:var(--sf);color:var(--tx);padding:18px;width:min(92vw,360px)}
dialog::backdrop{background:#0008}
dialog .row{border:0}
.pop{position:fixed;font-size:26px;pointer-events:none;animation:pop 1.4s ease-out forwards;z-index:8}
@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(240deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<meta name="theme-color" content="#04161c">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gota">

<body>
<div id="toast" role="alert"><span style="font-size:26px">💧</span><span id="tmsg"></span></div>

<header>
  <h1>Gota</h1>
  <span class="streak" id="streak">🔥 0 dias</span>
</header>
<p class="quote" id="quote"></p>

<section class="hero">
  <svg class="bottle" viewBox="0 0 200 280" aria-label="Garrafa de água">
    <defs>
      <clipPath id="cp"><path d="M80 10h40v30c0 12 50 20 50 50v160a25 25 0 0 1-25 25H55a25 25 0 0 1-25-25V90c0-30 50-38 50-50z"/></clipPath>
      <linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/></linearGradient>
    </defs>
    <path d="M80 10h40v30c0 12 50 20 50 50v160a25 25 0 0 1-25 25H55a25 25 0 0 1-25-25V90c0-30 50-38 50-50z" fill="var(--glass)"/>
    <g clip-path="url(#cp)">
      <g id="lvl" style="transform:translateY(265px)">
        <path class="wave2" id="w2" fill="#0ea5e9" d="M-200 0q25-14 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0V300H-200z"/>
        <path class="wave" id="w1" fill="#0ea5e9" d="M-200 4q25 12 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0V300H-200z"/>
        <g fill="#fff"><circle class="bub" cx="70" cy="200" r="4"/><circle class="bub" cx="120" cy="215" r="3" style="animation-delay:1.3s"/><circle class="bub" cx="95" cy="190" r="5" style="animation-delay:2.4s"/><circle class="bub" cx="140" cy="205" r="3" style="animation-delay:3.1s"/></g>
      </g>
      <rect x="30" y="0" width="140" height="280" fill="url(#gl)"/>
    </g>
    <path d="M80 10h40v30c0 12 50 20 50 50v160a25 25 0 0 1-25 25H55a25 25 0 0 1-25-25V90c0-30 50-38 50-50z" fill="none" stroke="var(--tx)" stroke-width="4" stroke-opacity=".7"/>
    <rect x="76" y="2" width="48" height="14" rx="6" fill="var(--tx)" fill-opacity=".75"/>
  </svg>
  <div class="side">
    <div class="big"><span id="ml">0</span> <small>/ <span id="goal">2000</span> ml</small></div>
    <div class="mu" id="pct">0%</div>
    <div><span class="mascot" id="face">😴</span></div>
    <div class="say" id="say">Bora começar?</div>
  </div>
</section>

<div class="next"><span id="nextTxt">—</span><button class="btn" id="nbtn">🔔 Ativar avisos</button></div>

<h2>Rotina de hoje</h2>
<div class="rt" id="rt"></div>
<button class="add" id="addr">＋ Novo horário</button>

<h2>Beber extra</h2>
<div class="drinks" id="drinks"></div>
<div class="sizes" id="sizes"></div>
<button class="drink" id="go">Beber</button>
<ul id="log"></ul>

<h2>Últimos 7 dias</h2>
<div class="week" id="week"></div>

<h2>Ajustes</h2>
<div class="set">
  <div class="row"><label for="g">Meta diária (ml)</label><input id="g" type="number" min="500" step="100"></div>
  <div class="row"><span>Avisos ligados</span><button class="sw" id="sw" aria-label="Ligar avisos"></button></div>
  <div class="row"><span class="mu" id="perm"></span><button class="btn" id="test">Testar aviso</button></div>
</div>

<dialog id="dlg">
  <h2 style="margin-top:0" id="dt">Nova bebida</h2>
  <div class="row"><label>Emoji</label><input id="de" maxlength="4" style="width:70px;font-size:20px"></div>
  <div class="row"><label>Nome</label><input id="dn" maxlength="16"></div>
  <div class="row"><label>Cor</label><input id="dc" type="color" value="#38bdf8"></div>
  <div class="row"><label>Hidrata (%)</label><input id="df" type="number" min="0" max="100" step="5"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="ddel">Excluir</button><button class="btn" id="dcan">Cancelar</button><button class="btn pri" id="dok">Salvar</button></div>
</dialog>

<dialog id="rdlg">
  <h2 style="margin-top:0" id="rt2">Novo horário</h2>
  <div class="row"><label>Nome</label><input id="rn" maxlength="22" placeholder="Ao acordar" style="width:150px"></div>
  <div class="row"><label>Hora</label><input id="rh" type="time" style="width:120px"></div>
  <div class="row"><label>Quantidade (ml)</label><input id="rm" type="number" min="50" step="50"></div>
  <div class="row"><label>Bebida</label><input id="rd" list="dl" maxlength="20" placeholder="Digite: água, whey..." style="width:150px"></div>
  <div class="row"><label>Emoji</label><input id="re" maxlength="4" style="width:70px;font-size:20px"></div>
  <datalist id="dl"></datalist>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="rdel">Excluir</button><button class="btn" id="rcan">Cancelar</button><button class="btn pri" id="rok">Salvar</button></div>
</dialog>

<script>
const K="gota-v1";
const DEF={goal:2500,cup:250,sel:"agua",on:false,fired:{},logs:{},routine:[
{id:"r1",n:"Ao acordar",h:"07:00",ml:300,d:"agua"},{id:"r2",n:"Manhã",h:"09:30",ml:250,d:"agua"},{id:"r3",n:"Antes do almoço",h:"11:45",ml:300,d:"agua"},
{id:"r4",n:"Almoço",h:"13:00",ml:200,d:"suco"},{id:"r5",n:"Tarde",h:"15:30",ml:300,d:"agua"},{id:"r6",n:"Pré-treino",h:"17:30",ml:300,d:"iso"},
{id:"r7",n:"Pós-treino",h:"19:30",ml:400,d:"agua"},{id:"r8",n:"Jantar",h:"20:30",ml:250,d:"cha"},{id:"r9",n:"Antes de dormir",h:"22:00",ml:200,d:"agua"}],drinks:[
{id:"agua",n:"Água",e:"💧",c:"#38bdf8",f:1},{id:"cha",n:"Chá",e:"🍵",c:"#a3e635",f:.9},
{id:"cafe",n:"Café",e:"☕",c:"#b45309",f:.8},{id:"suco",n:"Suco",e:"🍊",c:"#fb923c",f:.85},
{id:"coco",n:"Água de coco",e:"🥥",c:"#5eead4",f:1},{id:"iso",n:"Isotônico",e:"⚡",c:"#a78bfa",f:.95}]};
let S;
try{S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){S=JSON.parse(JSON.stringify(DEF))}
if(typeof S.fired!=="object"||!S.fired)S.fired={};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const dkey=d=>new Date(d).toLocaleDateString("sv");
const hm=t=>new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const drink=()=>S.drinks.find(d=>d.id===S.sel)||S.drinks[0];
const dayLogs=k=>S.logs[k]||[];
const eff=k=>Math.round(dayLogs(k).reduce((a,l)=>a+l.ml*l.f,0));

function faceFor(p){return p>=1?["🤩","Meta batida! Você é um oceano."]:p>=.75?["😎","Quase lá, só mais um gole!"]:p>=.4?["😄","Metade do caminho. Segue o fluxo!"]:p>0?["🙂","Primeiros goles, boa!"]:["😴","Estou secando... bora começar?"]}

function render(){
  const k=dkey(Date.now()),v=eff(k),p=Math.min(v/S.goal,1),d=drink();
  document.documentElement.style.setProperty("--c",d.c);
  $("#ml").textContent=v;$("#goal").textContent=S.goal;$("#pct").textContent=Math.round(v/S.goal*100)+"% da meta";
  $("#lvl").style.transform=`translateY(${265-250*p}px)`;
  $("#w1").setAttribute("fill",d.c);$("#w2").setAttribute("fill",d.c);
  const [f,m]=faceFor(v/S.goal);$("#face").textContent=f;$("#say").textContent=m;
  $("#go").textContent=`${d.e} Beber ${S.cup} ml de ${d.n.toLowerCase()}`;
  $("#drinks").innerHTML=S.drinks.map(x=>`<button class="chip ${x.id===S.sel?"on":""}" style="--c:${x.c}" data-d="${x.id}">${x.e} ${x.n}</button>`).join("")+`<button class="chip" data-a="edit">✎</button><button class="chip" data-a="new">＋ Nova</button>`;
  $("#sizes").innerHTML=[100,150,250,330,500].map(n=>`<button class="${n===S.cup?"on":""}" data-s="${n}">${n}</button>`).join("");
  const L=dayLogs(k).filter(l=>!l.r).reverse();
  $("#log").innerHTML=L.length?L.map(l=>`<li><span>${l.e}</span><span>${hm(l.t)}</span><span>${l.ml} ml</span><button data-del="${l.t}" aria-label="Remover">×</button></li>`).join(""):``;
  let wk="";
  for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const e=eff(dkey(dt)),h=Math.min(e/S.goal,1)*60;
    wk+=`<div class="day"><div class="bar ${e>=S.goal?"ok":""}" style="height:${h}px"></div>${["D","S","T","Q","Q","S","S"][dt.getDay()]}</div>`}
  $("#week").innerHTML=wk;
  let st=0;const dt=new Date();if(eff(dkey(dt))<S.goal)dt.setDate(dt.getDate()-1);
  while(eff(dkey(dt))>=S.goal){st++;dt.setDate(dt.getDate()-1)}
  $("#streak").textContent=`🔥 ${st} ${st===1?"dia":"dias"}`;
  $("#g").value=S.goal;renderRt(k);
  $("#sw").classList.toggle("on",S.on);
  $("#nbtn").style.display=S.on?"none":"";
  perm();nextInfo();
}

function perm(){
  const n="Notification" in window?Notification.permission:"nope";
  $("#perm").textContent=n==="granted"?"Notificações do celular: liberadas":n==="denied"?"Notificações bloqueadas · vou avisar aqui no app":n==="nope"?"Sem suporte · avisos só dentro do app":"Notificações: aguardando permissão";
}

const mins=h=>{const[a,b]=h.split(":");return +a*60+ +b};
const rs=()=>S.routine.slice().sort((a,b)=>mins(a.h)-mins(b.h));
const isDone=(k,id)=>dayLogs(k).some(l=>l.r===id);
function nextInfo(){
  if(!S.on){$("#nextTxt").textContent="Avisos desligados";return}
  const n=new Date(),now=n.getHours()*60+n.getMinutes(),k=dkey(n),nx=rs().find(r=>mins(r.h)>now&&!isDone(k,r.id));
  $("#nextTxt").textContent=nx==null?"Sem mais horários hoje 🌙":`Próximo: ${nx.n} às ${nx.h} (em ${mins(nx.h)-now} min)`;
}

function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sine";o.frequency.setValueAtTime(660,c.currentTime);o.frequency.exponentialRampToValueAtTime(990,c.currentTime+.18);g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start();o.stop(c.currentTime+.5)}catch(e){}}
let SWR=null;
try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(r=>{SWR=r}).catch(()=>{})}catch(e){}
let tt;
function notify(msg){
  $("#tmsg").textContent=msg;$("#toast").classList.add("show");clearTimeout(tt);tt=setTimeout(()=>$("#toast").classList.remove("show"),7000);
  beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{if("Notification" in window&&Notification.permission==="granted"){const o={body:msg,tag:"gota",icon:"icon-192.png",badge:"icon-192.png",vibrate:[200,100,200]};if(SWR)SWR.showNotification("💧 Hora de beber!",o);else new Notification("💧 Hora de beber!",o)}}catch(e){}
}
$("#toast").onclick=()=>$("#toast").classList.remove("show");

const FRASES=n=>[`Seu corpo pediu ${n}. Atende, vai!`,`Plin! Hora de um gole de ${n}.`,`Sua plantinha interior quer ${n} 🌱`,`Pausa estratégica: ${n} agora.`,`Gota aqui: tô com sede de ${n}!`];
function tick(){
  nextInfo();if(!S.on)return;
  const n=new Date(),now=n.getHours()*60+n.getMinutes(),k=dkey(n);
  Object.keys(S.fired).forEach(x=>{if(!x.startsWith(k))delete S.fired[x]});
  rs().forEach(r=>{const key=k+"-"+r.id,m=mins(r.h);
    if(m>now||S.fired[key]||now-m>20)return;
    S.fired[key]=1;save();if(isDone(k,r.id))return;
    const d=S.drinks.find(x=>x.id===r.d)||drink();
    notify(`${r.n}: ${r.ml} ml de ${d.n.toLowerCase()} 💧`)});
}
setInterval(tick,20000);document.addEventListener("visibilitychange",tick);

function burst(){for(let i=0;i<14;i++){const s=document.createElement("span");s.className="pop";s.textContent=["🎉","💧","✨","🌊"][i%4];s.style.left="50%";s.style.top="35%";s.style.setProperty("--x",(Math.random()*300-150)+"px");s.style.setProperty("--y",(Math.random()*-220-20)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}

$("#go").onclick=()=>{
  const k=dkey(Date.now()),d=drink(),before=eff(k);
  (S.logs[k]=S.logs[k]||[]).push({t:Date.now(),ml:S.cup,d:d.id,e:d.e,f:d.f});save();render();
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  if(before<S.goal&&eff(k)>=S.goal)burst();
};
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-d],[data-a],[data-s],[data-del],[data-r],[data-re]");if(!t)return;
  if(t.dataset.r){toggleR(t.dataset.r);return}
  if(t.dataset.re){openR(t.dataset.re);return}
  if(t.dataset.d){S.sel=t.dataset.d;save();render()}
  else if(t.dataset.s){S.cup=+t.dataset.s;save();render()}
  else if(t.dataset.del){const k=dkey(Date.now());S.logs[k]=dayLogs(k).filter(l=>String(l.t)!==t.dataset.del);save();render()}
  else openDlg(t.dataset.a==="edit");
});

let editing=false;
function openDlg(ed){editing=ed;const d=drink();
  $("#dt").textContent=ed?"Editar bebida":"Nova bebida";
  $("#de").value=ed?d.e:"🥤";$("#dn").value=ed?d.n:"";$("#dc").value=ed?d.c:"#38bdf8";$("#df").value=ed?Math.round(d.f*100):100;
  $("#ddel").style.display=ed&&S.drinks.length>1?"":"none";
  try{$("#dlg").showModal()}catch(e){$("#dlg").setAttribute("open","")}}
$("#dcan").onclick=()=>$("#dlg").close();
$("#dok").onclick=()=>{
  const o={n:$("#dn").value.trim()||"Bebida",e:$("#de").value.trim()||"🥤",c:$("#dc").value,f:Math.max(0,Math.min(100,parseFloat($("#df").value)||100))/100};
  if(editing)Object.assign(drink(),o);else{o.id="d"+Date.now();S.drinks.push(o);S.sel=o.id}
  save();$("#dlg").close();render();
};
$("#ddel").onclick=()=>{S.drinks=S.drinks.filter(d=>d.id!==S.sel);S.sel=S.drinks[0].id;save();$("#dlg").close();render()};

const QUOTES=["Quem se hidrata, rende mais.","Um gole de cada vez também chega longe.","Seu corpo é 60% água. Cuide da maioria!","Constância vence motivação.","Hoje é dia de bater a meta.","Água é o suplemento mais barato que existe.","Cada check conta.","Sede é atraso: beba antes de sentir.","Pequenos goles, grandes resultados.","Seu eu de amanhã agradece."];
function renderRt(k){
  const n=new Date(),now=n.getHours()*60+n.getMinutes();
  $("#quote").textContent="“"+QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length]+"”";
  $("#rt").innerHTML=rs().map(r=>{const d=S.drinks.find(x=>x.id===r.d)||S.drinks[0],ok=isDone(k,r.id),late=!ok&&mins(r.h)<now;
    return `<div class="it ${ok?"done":""} ${late?"late":""}" style="--c:${d.c}"><button class="ck" data-r="${r.id}" aria-label="Marcar">${ok?"✓":""}</button><div class="inf"><b>${r.n}: ${r.ml} ml</b><span class="mu">${r.h} · ${d.e} ${d.n}${late?" · atrasado":""}</span></div><button class="ed" data-re="${r.id}" aria-label="Editar">✎</button></div>`}).join("")||`<p class="empty">Sua rotina está vazia. Adicione um horário.</p>`;
}
function toggleR(id){const k=dkey(Date.now()),r=S.routine.find(x=>x.id===id);if(!r)return;
  const L=dayLogs(k),i=L.findIndex(l=>l.r===id);
  if(i>=0){L.splice(i,1)}else{const d=S.drinks.find(x=>x.id===r.d)||S.drinks[0],before=eff(k);
    L.push({t:Date.now(),ml:r.ml,d:d.id,e:d.e,f:d.f,r:id});
    if(before<S.goal&&eff(k)>=S.goal)setTimeout(burst,50)}
  S.logs[k]=L;save();render();try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
let rid=null;
function openR(id){rid=id;const r=S.routine.find(x=>x.id===id)||{n:"",h:"12:00",ml:250,d:S.sel};
  $("#rt2").textContent=id?"Editar horário":"Novo horário";
  $("#rn").value=r.n;$("#rh").value=r.h;$("#rm").value=r.ml;
  $("#dl").innerHTML=S.drinks.map(x=>`<option value="${x.n}">`).join("");const dd=S.drinks.find(x=>x.id===r.d)||S.drinks[0];$("#rd").value=dd.n;$("#re").value=dd.e;
  $("#rdel").style.display=id?"":"none";
  try{$("#rdlg").showModal()}catch(e){$("#rdlg").setAttribute("open","")}}
$("#addr").onclick=()=>openR(null);
$("#rd").oninput=()=>{const x=S.drinks.find(y=>y.n.toLowerCase()===$("#rd").value.trim().toLowerCase());if(x)$("#re").value=x.e};
$("#rcan").onclick=()=>$("#rdlg").close();
$("#rok").onclick=()=>{const dn=$("#rd").value.trim()||"Água",em=$("#re").value.trim();let dr=S.drinks.find(x=>x.n.toLowerCase()===dn.toLowerCase());
  if(dr){if(em)dr.e=em}else{dr={id:"d"+Date.now(),n:dn,e:em||"🥤",c:["#f472b6","#facc15","#34d399","#60a5fa","#fb7185","#c084fc"][S.drinks.length%6],f:1};S.drinks.push(dr)}
  const o={n:$("#rn").value.trim()||"Horário",h:$("#rh").value||"12:00",ml:+$("#rm").value||250,d:dr.id};
  if(rid)Object.assign(S.routine.find(x=>x.id===rid),o);else S.routine.push({id:"r"+Date.now(),...o});
  save();$("#rdlg").close();render()};
$("#rdel").onclick=()=>{S.routine=S.routine.filter(x=>x.id!==rid);save();$("#rdlg").close();render()};

async function enable(){
  S.on=true;
  try{if("Notification" in window&&Notification.permission==="default")await Notification.requestPermission()}catch(e){}
  save();render();
}
$("#sw").onclick=()=>{if(S.on){S.on=false;save();render()}else enable()};
$("#nbtn").onclick=enable;
$("#test").onclick=async()=>{try{if("Notification" in window&&Notification.permission==="default")await Notification.requestPermission()}catch(e){}perm();notify(`Teste ok! Hora de um gole de ${drink().n.toLowerCase()} 💧`)};
[["g","goal"]].forEach(([id,key])=>$("#"+id).onchange=()=>{const v=+$("#"+id).value;if(v>0||key==="s"){S[key]=v;save();render()}});
render();
</script>
</body>
</html>
